<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04130F">
<title>সদস্য</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;600;700&family=Amiri+Quran&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/islamic.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="p-body">
<main class="p-wrap" id="app"></main>
<script type="module">
import { db, getDoc, doc } from "./assets/firebase.js";
import { mountBg, mountNav, requireUser, touchUser, topHtml, setTop, plaqueHead, loaderHtml, msgHtml, ICON, qs, esc, T } from "./assets/app.js";

mountBg('member'); mountNav('home');
const app = document.getElementById('app');
document.body.insertAdjacentHTML('afterbegin', topHtml({ title: '...', back: 'members.html' }));
app.innerHTML = loaderHtml(3);
const user = await requireUser(); touchUser(user);
const waNum = (v) => { let d = String(v || '').replace(/\D/g, ''); if (d.startsWith('00')) d = d.slice(2); else if (d.startsWith('0') && d.length === 11) d = '88' + d; return d; };
const PH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h3l1.5 4-2 1.3a11 11 0 0 0 5.2 5.2l1.3-2 4 1.5v3a2 2 0 0 1-2.2 2A15 15 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z"/></svg>';
const WA = ICON.mail ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2.5 21.5 7.9 20Z"/><path d="M9 9c.5 2.5 2.5 4.5 6 6l1.2-1.5-2.2-1-1 .8c-1-.5-1.8-1.3-2.3-2.3l.8-1-1-2.2L9 9Z"/></svg>' : '';
const OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="14" rx="2"/><path d="M9 6V4h6v2M4 12h16"/></svg>';
const LOC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>';
try {
  const id = qs('id'); if (!id) throw 0;
  const snap = await getDoc(doc(db, 'members', id));
  if (!snap.exists() || snap.data().hidden) { app.innerHTML = msgHtml(T('mem_missing'), true); throw 0; }
  const m = snap.data(); document.title = m.name; setTop(m.name, m.role || '');
  const row = (ic, label, val, href = '', cls = '', note = '') => val ? `<${href ? 'a href="' + esc(href) + '"' + (href.startsWith('http') ? ' target="_blank" rel="noopener noreferrer"' : '') : 'div'} class="mi ${cls}"><b>${ic}</b><span><small>${esc(label)}</small>${esc(val)}${note ? `<small>${esc(note)}</small>` : ''}</span></${href ? 'a' : 'div'}>` : '';
  const wa = waNum(m.wa), tel = String(m.mobile || '').replace(/[^\d+]/g, '');
  app.innerHTML = plaqueHead({ eyebrow: m.role || T('mem_eyebrow'), title: m.name }) + `<div class="p-minfo">` +
    row(PH, T('mem_mobile'), m.mobile, tel ? 'tel:' + tel : '') +
    row(WA, T('mem_wa'), m.wa, wa.length > 6 ? 'https://wa.me/' + wa : '', 'wa', T('mem_wa_open')) +
    row(OFF, T('mem_office'), m.office) + row(LOC, T('mem_addr'), m.addr) + `</div>`;
} catch (err) { if (err) { console.error(err); app.innerHTML = msgHtml(T('load_err'), true); } }
</script>
</body>
</html>
