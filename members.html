<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04130F">
<title>সদস্য তালিকা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;600;700&family=Amiri+Quran&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/islamic.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="p-body">
<main class="p-wrap" id="app"></main>
<script type="module">
import { db, collection, getDocs } from "./assets/firebase.js";
import { mountBg, mountNav, requireUser, touchUser, topHtml, setTop, memberBtnHtml, plaqueHead, loaderHtml, msgHtml, emptyHtml, ICON, toBn, T } from "./assets/app.js";

mountBg('members'); mountNav('home');
const app = document.getElementById('app');
document.body.insertAdjacentHTML('afterbegin', topHtml({ title: T('mem_title'), back: 'index.html' }));
app.innerHTML = loaderHtml(4);
const user = await requireUser(); touchUser(user);
document.title = T('mem_title');
try {
  const snap = await getDocs(collection(db, 'members'));
  const items = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => !x.hidden && x.name).sort((a, b) => (a.order || 0) - (b.order || 0));
  app.innerHTML = plaqueHead({ eyebrow: T('mem_eyebrow'), title: T('mem_title'), sub: items.length ? T('mem_count', { n: toBn(items.length) }) : '' }) +
    (items.length ? `<div class="p-stack">${items.map((m, i) => memberBtnHtml({ label: m.name, sub: m.role || '', href: 'member.html?id=' + encodeURIComponent(m.id), i })).join('')}</div>`
      : emptyHtml(ICON.user, T('mem_empty')));
} catch (err) { console.error(err); app.innerHTML = msgHtml(T('load_err'), true); }
</script>
</body>
</html>
